spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/url_shorten}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sa}
# Create/update tables from JPA entities when missing (url_mappings, etc.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Dialect is auto-detected; kept for older local setups
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.short-code.strategy=${SHORT_CODE_STRATEGY:counter}
app.short-code.hash-length=${SHORT_CODE_HASH_LENGTH:8}
server.error.include-message=never
